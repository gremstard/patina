name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # The determinism test (§5) is the guard that the world can't silently
      # drift. It must pass on every push.
      - run: node --test
      # Both bundles must build cleanly (the city bundle needs esbuild + three).
      - run: node scripts/bundle-web.js
      - run: node scripts/bundle-city.js
